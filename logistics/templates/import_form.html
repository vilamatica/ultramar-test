<div
    class="modal fade"
    id="import-xls-modal"
    tabindex="-1"
    aria-labelledby="import-xls-modal"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="import-xls-form" enctype="multipart/form-data">
          <div class="modal-header">
            <h5 class="modal-title" id="cu-modal-title">
              Import your data here
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            {% csrf_token %}
              <div class="mb-3">
                <input type="file" class="form-control" id="fileInput" name="file" accept=".xlsx" required />
              </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
